version: '3'
services:
  postgres:
    image: "postgres:16"
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=root      
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d root"]
      interval: 5s
      timeout: 5s
      retries: 5  

  pgadmin-compose:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "aparicio.junior@example.com"
      PGADMIN_DEFAULT_PASSWORD: "admin123"
    ports:
      - "54321:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
